
<div class="card post-card border-0 mb-4">

    <div class="row no-gutters">

        <div class="col-4">

            <a href="{% url 'blogs' post.slug %}">
                <img
                    src="{{ post.featured_image.url }}"
                    class="post-thumb img-fluid"
                    style="
                        width: 100%;
                        height: 130px;
                        object-fit: cover;
                        border-radius: 0.4rem;
                    "
                    alt="{{ post.title }}"
                >
            </a>

        </div>

        <div class="col-8">

            <div class="card-body pt-0">

                <a
                    href="{% url 'posts_by_category' post.category.id %}"
                    class="badge badge-warning"
                >
                    {{ post.category }}
                </a>

                <h4 class="mt-1 mb-1">

                    <a
                        href="{% url 'blogs' post.slug %}"
                        class="text-dark"
                    >
                        {{ post.title }}
                    </a>

                </h4>

                <small class="text-muted">
                    {{ post.created_at|timesince }} ago
                    &middot;
                    {{ post.author }}
                    &middot;
                    {{ post.reading_time }} min read
                    &middot;
                    {{ post.views }} views
                </small>

                <p class="card-text mt-1">
                    {{ post.short_description|truncatewords:28 }}
                </p>

            </div>

        </div>

    </div>

</div>
